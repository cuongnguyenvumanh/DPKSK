<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa lịch khám đơn vị | MWK Điều phối KSK</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        primary: { DEFAULT: '#27496D', hover: '#1F3D5A' }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome v6 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="shortcut icon" href="#">
</head>
<body data-depth="sub" data-active-nav="nav-tao-lich-ksk" data-breadcrumb="Chỉnh sửa lịch khám đơn vị" class="bg-[#F4F5F7] font-sans text-[#1F2937] antialiased h-screen overflow-hidden flex flex-col">

    <div class="flex h-full w-full overflow-hidden">
        <!-- SIDEBAR CONTAINER -->
        <div id="sidebar-container" class="flex flex-shrink-0 h-full"></div>

        <!-- MAIN CONTAINER -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-[#F4F5F7] relative">
            <!-- HEADER CONTAINER -->
            <div id="header-container"></div>

            <!-- MAIN SCROLL & CONTENT WRAPPER -->
            <div class="flex-1 overflow-y-auto flex flex-col justify-between">
                <main class="p-5 space-y-4 flex-1">
                    <!-- Page Title & Navigation Header Card -->
                    <div class="flex items-center justify-between gap-4 bg-white p-4 rounded-[4px] border border-[#D9DEE5]">
                        <div class="flex items-center gap-3">
                            <a href="../index.html" class="w-8 h-8 rounded-[4px] bg-white border border-[#D9DEE5] hover:bg-[#F3F6FA] text-[#4B5563] flex items-center justify-center transition-colors">
                                <i class="fa-solid fa-arrow-left text-xs"></i>
                            </a>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h1 class="text-xl font-bold text-[#1F2937]">Chỉnh sửa Lịch KSK</h1>
                                    <span id="schedule-code-badge" class="px-2 py-0.5 rounded-[4px] bg-[#E8F1FB] text-[#27496D] font-bold text-xs border border-[#B3CDE6]">--</span>
                                </div>
                                <p class="text-xs text-[#6B7280] mt-0.5">Cập nhật thông tin khách hàng và danh sách chi tiết các lịch khám KSK</p>
                            </div>
                        </div>
                        <div>
                            <button type="button" onclick="openHistoryDrawer()" class="btn-secondary text-xs" title="Xem lịch sử thay đổi">
                                <i class="fa-solid fa-clock-rotate-left text-[#27496D] text-xs"></i>
                                <span>Lịch sử thay đổi</span>
                            </button>
                        </div>
                    </div>



                    <!-- FORM CONTAINER CARD -->
                    <div class="bg-white p-5 rounded-[4px] border border-[#D9DEE5]">
                        <form id="ksk-edit-form" onsubmit="return false;" class="space-y-4">
                            
                            <!-- STEP 1: THÔNG TIN KHÁCH HÀNG & PAKD -->
                            <div id="step1-customer-info-container"></div>

                            <!-- STEP 2: TẠO LỊCH & LỰA CHỌN LOẠI LỊCH -->
                            <div id="step2-schedule-select-container"></div>

                        </form>
                    </div>
                </main>

                <!-- STICKY ACTION BAR -->
                <div id="sticky-action-bar-container"></div>
            </div>

        </div>
    </div>

    <!-- DRAWER LỊCH SỬ THAY ĐỔI -->
    <div id="history-drawer-backdrop" onclick="closeHistoryDrawer()" class="fixed inset-0 bg-slate-900/30 backdrop-blur-xs z-50 opacity-0 pointer-events-none transition-opacity duration-300"></div>

    <div id="history-drawer" class="fixed top-0 right-0 bottom-0 w-[460px] max-w-full bg-white shadow-lg z-50 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col font-sans select-none border-l border-[#D9DEE5]">
        <!-- Header -->
        <div class="px-5 h-[52px] bg-[#27496D] text-white flex items-center justify-between shadow-xs">
            <div class="flex items-center gap-2.5">
                <div class="w-7 h-7 rounded-[4px] bg-white/10 text-white flex items-center justify-center text-sm">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <div>
                    <h3 class="font-semibold text-sm text-white leading-tight">Lịch sử thay đổi</h3>
                    <p id="drawer-schedule-code" class="text-[11px] text-slate-300 font-mono"></p>
                </div>
            </div>
            <button type="button" onclick="closeHistoryDrawer()" class="w-8 h-8 rounded-[4px] hover:bg-white/10 text-white flex items-center justify-center transition-colors cursor-pointer" title="Đóng">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <!-- Timeline Body -->
        <div id="history-timeline-container" class="flex-1 overflow-y-auto p-5 space-y-4 bg-[#F4F5F7]">
            <!-- Timeline items rendered dynamically -->
        </div>

        <!-- Footer -->
        <div class="px-5 py-3 bg-white border-t border-[#D9DEE5] flex items-center justify-between text-xs text-[#6B7280]">
            <span id="history-item-count" class="font-medium text-[#4B5563]"></span>
            <button type="button" onclick="closeHistoryDrawer()" class="btn-secondary text-xs">
                Đóng
            </button>
        </div>
    </div>

    <!-- MODAL XEM ĐỊNH MỨC KSK -->
    <div id="modal-dinh-muc-container"></div>

    <!-- MODAL THÊM MỚI LỊCH THỬ NGHIỆM -->
    <div id="modal-add-schedule-container"></div>

    <!-- MAIN JAVASCRIPT & DATA-STORE INTEGRATION -->
    <script src="../../js/data-store.js"></script>
    <script src="../../js/main.js"></script>
    <script src="edit.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadEditSubComponents();
            initEditModule();
        });

        async function loadEditSubComponents() {
            const components = [
                { id: 'step1-customer-info-container', path: '../create/step1-customer-info.html' },
                { id: 'step2-schedule-select-container', path: '../create/step2-schedule-select.html' },
                { id: 'sticky-action-bar-container', path: '../create/sticky-action-bar.html' },
                { id: 'modal-dinh-muc-container', path: '../create/modal-dinh-muc.html' },
                { id: 'modal-add-schedule-container', path: '../create/modal-add-schedule.html' }
            ];

            for (const c of components) {
                const elem = document.getElementById(c.id);
                if (!elem) continue;
                try {
                    const res = await fetch(c.path);
                    if (res.ok) {
                        elem.innerHTML = await res.text();
                    }
                } catch (err) {
                    console.error('Lỗi load component edit:', c.path, err);
                }
            }
        }
    </script>
</body>
</html>
