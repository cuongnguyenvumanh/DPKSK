    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadCreateSubComponents();
            initCreateModule();
        });

        async function loadCreateSubComponents() {
            const components = [
                { id: 'step1-customer-info-container', path: 'step1-customer-info.html' },
                { id: 'step2-schedule-select-container', path: 'step2-schedule-select.html' },
                { id: 'sticky-action-bar-container', path: 'sticky-action-bar.html' },
                { id: 'modal-dinh-muc-container', path: 'modal-dinh-muc.html' },
                { id: 'modal-add-schedule-container', path: 'modal-add-schedule.html' }
            ];

            for (const c of components) {
                const elem = document.getElementById(c.id);
                if (!elem) continue;
                try {
                    const res = await fetch(c.path);
                    if (res.ok) {
                        elem.innerHTML = await res.text();
                    } else {
                        loadFallbackComponent(c.id, elem);
                    }
                } catch (err) {
                    loadFallbackComponent(c.id, elem);
                }
            }
        }
