<!-- ================= UNIFIED HIS FILTER TOOLBAR COMPONENT ================= -->
<div class="flex flex-wrap items-center gap-3">
    <select id="filter-type-select" class="h-9 px-3 border border-[#D9DEE5] rounded-[4px] text-xs text-[#1F2937] bg-white focus:outline-none focus:border-[#27496D] transition-colors cursor-pointer">
        <option value="">-- Tất cả phân loại --</option>
        <option value="cat1">Phân loại A</option>
        <option value="cat2">Phân loại B</option>
    </select>

    <select id="filter-status-select" class="h-9 px-3 border border-[#D9DEE5] rounded-[4px] text-xs text-[#1F2937] bg-white focus:outline-none focus:border-[#27496D] transition-colors cursor-pointer">
        <option value="">-- Tất cả trạng thái --</option>
        <option value="active">Đang hoạt động</option>
        <option value="inactive">Tạm khóa</option>
    </select>

    <button id="filter-btn" class="h-9 px-3.5 bg-white border border-[#D9DEE5] hover:bg-[#F3F6FA] text-[#374151] rounded-[4px] text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer">
        <i class="fa-solid fa-filter text-[11px] text-[#6B7280]"></i> <span>Lọc</span>
    </button>
</div>
