<!-- ================= UNIFIED HIS HEADER COMPONENT ================= -->
<header class="h-[56px] bg-white border-b border-[#D9DEE5] flex items-center justify-between px-5 z-20 flex-shrink-0">
    <div class="flex items-center gap-3">
        <!-- Toggle Button -->
        <button id="sidebar-toggle-btn" class="w-8 h-8 rounded-[4px] text-[#4B5563] hover:bg-[#F3F6FA] hover:text-[#1F2937] border border-[#D9DEE5] flex items-center justify-center transition-colors cursor-pointer" title="Thu gọn / Mở rộng Sidebar">
            <i class="fa-solid fa-bars text-sm"></i>
        </button>
        <div class="h-4 w-px bg-[#D9DEE5] hidden sm:block"></div>
        <!-- Dynamic Breadcrumb -->
        <nav id="breadcrumb-container" class="hidden sm:flex items-center text-[13px] text-[#6B7280] gap-2">
            <a href="#" id="breadcrumb-home-link" class="hover:text-[#27496D] flex items-center gap-1.5"><i class="fa-solid fa-house text-[#9CA3AF] text-xs"></i> <span>Trang chủ</span></a>
            <i class="fa-solid fa-chevron-right text-[9px] text-[#9CA3AF]"></i>
            <span id="breadcrumb-current" class="font-semibold text-[#1F2937]">Cấu hình danh mục sơ đồ khám</span>
        </nav>
    </div>

    <!-- Header Actions (Right) -->
    <div class="flex items-center gap-3">
        <!-- Help Icon Button -->
        <button type="button" class="w-8 h-8 rounded-[4px] border border-[#D9DEE5] text-[#4B5563] hover:bg-[#F3F6FA] hover:text-[#27496D] flex items-center justify-center transition-colors cursor-pointer" title="Trợ giúp & Hướng dẫn">
            <i class="fa-regular fa-circle-question text-sm"></i>
        </button>

        <!-- Dropdown Đơn vị / Cơ sở -->
        <div class="hidden md:flex items-center">
            <select class="h-8 px-2.5 bg-white border border-[#D9DEE5] rounded-[4px] text-xs font-medium text-[#374151] focus:outline-none focus:border-[#27496D] transition-colors cursor-pointer">
                <option value="Ba Đình">Bệnh viện MEDLATEC - Ba Đình</option>
                <option value="Cầu Giấy">PKĐK MEDLATEC - Cầu Giấy</option>
                <option value="Tây Hồ">PKĐK MEDLATEC - Tây Hồ</option>
                <option value="Thanh Xuân">PKĐK MEDLATEC - Thanh Xuân</option>
            </select>
        </div>

        <!-- Notification Icon -->
        <button type="button" class="relative w-8 h-8 rounded-[4px] border border-[#D9DEE5] text-[#4B5563] hover:bg-[#F3F6FA] hover:text-[#27496D] flex items-center justify-center transition-colors cursor-pointer" title="Thông báo hệ thống">
            <i class="fa-regular fa-bell text-sm"></i>
            <span class="absolute -top-1 -right-1 bg-[#D32F2F] text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">3</span>
        </button>

        <div class="h-5 w-px bg-[#D9DEE5]"></div>

        <!-- User Dropdown & Avatar -->
        <div class="flex items-center gap-2.5 cursor-pointer">
            <img src="https://ui-avatars.com/api/?name=Nguyen+Vu+Manh+Cuong&background=27496D&color=fff&bold=true" alt="Avatar" class="w-8 h-8 rounded-[4px] border border-[#D9DEE5]">
            <div class="hidden lg:flex flex-col text-left">
                <span class="text-xs font-semibold text-[#1F2937] leading-tight">Nguyễn Vũ Mạnh Cường</span>
                <span class="text-[11px] font-medium text-[#6B7280]">Tổng Giám Đốc</span>
            </div>
            <i class="fa-solid fa-chevron-down text-[10px] text-[#9CA3AF] hidden lg:block"></i>
        </div>
    </div>
</header>
