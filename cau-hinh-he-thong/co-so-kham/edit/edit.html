<!-- MODAL CHỈNH SỬA CƠ SỞ KHÁM -->
<div id="edit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-[4px] shadow-lg border border-[#D9DEE5] w-full max-w-lg overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="px-5 h-[52px] bg-[#27496D] text-white flex items-center justify-between">
            <h3 class="font-semibold text-sm text-white flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-xs text-[#FFCC80]"></i> Chỉnh sửa Cơ sở khám
            </h3>
            <button type="button" onclick="closeEditModal()" class="w-8 h-8 rounded-[4px] hover:bg-white/10 text-white flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>

        <!-- Form Body -->
        <form id="edit-form" onsubmit="handleSaveEdit(event)" class="p-5 space-y-4 text-xs" novalidate>
            <input type="hidden" id="edit-id" value="">

            <!-- Tên cơ sở khám (bắt buộc) -->
            <div>
                <label class="sys-label">Tên cơ sở khám <span class="text-[#D32F2F]">*</span></label>
                <input type="text" id="edit-name" placeholder="Nhập tên cơ sở khám..." class="sys-input text-xs">
            </div>

            <!-- Địa chỉ -->
            <div>
                <label class="sys-label">Địa chỉ</label>
                <input type="text" id="edit-addr" placeholder="Nhập địa chỉ..." class="sys-input text-xs">
            </div>

            <!-- Ghi chú -->
            <div>
                <label class="sys-label">Ghi chú</label>
                <textarea id="edit-note" rows="2" placeholder="Nhập ghi chú..." class="w-full p-2.5 bg-white border border-[#D9DEE5] rounded-[4px] text-xs text-[#1F2937] focus:outline-none focus:border-[#27496D]"></textarea>
            </div>

            <!-- Trạng thái -->
            <div class="flex items-center justify-between pt-2 border-t border-[#E6EAF0]">
                <span class="sys-label">Trạng thái hoạt động</span>
                <label class="relative inline-flex items-center cursor-pointer select-none">
                    <input type="checkbox" id="edit-status" class="sr-only peer">
                    <div class="w-8 h-4 bg-[#D9DEE5] peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-[#D9DEE5] after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-[#27496D]"></div>
                    <span class="ml-2 text-xs font-bold text-[#2E7D32]" id="edit-status-label">ON</span>
                </label>
            </div>

            <!-- Footer Action Buttons -->
            <div class="pt-3 flex items-center justify-end gap-2 border-t border-[#E6EAF0]">
                <button type="button" onclick="closeEditModal()" class="btn-secondary text-xs">Hủy bỏ</button>
                <button type="submit" class="btn-primary text-xs">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>

<!-- MODAL THOÁT TRANG CẢNH BÁO KHÔNG LƯU DỮ LIỆU KHI EDIT -->
<div id="edit-exit-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center hidden select-none p-4">
    <div class="bg-white rounded-[4px] shadow-lg border border-[#D9DEE5] w-full max-w-md overflow-hidden">
        <div class="p-5 text-center">
            <div class="w-10 h-10 bg-[#FFF3E0] text-[#ED6C02] rounded-full flex items-center justify-center mx-auto mb-3 text-lg border border-[#FFCC80]">
                <i class="fa-solid fa-circle-question"></i>
            </div>
            <h3 class="text-sm font-bold text-[#1F2937] mb-2">Thoát trang</h3>
            <p class="text-xs text-[#4B5563] mb-5 leading-relaxed">Khi Thoát trang, các thông tin đang nhập sẽ không được lưu. Bạn có chắc muốn thoát?</p>
            <div class="flex items-center justify-center gap-2">
                <button type="button" onclick="cancelEditExit()" class="btn-secondary text-xs w-28">Hủy</button>
                <button type="button" onclick="confirmEditExit()" class="btn-primary text-xs w-28">Thoát</button>
            </div>
        </div>
    </div>
</div>

<script>
    let initialEditSnapshot = '';

    function getEditSnapshot() {
        const name = document.getElementById('edit-name') ? document.getElementById('edit-name').value.trim() : '';
        const addr = document.getElementById('edit-addr') ? document.getElementById('edit-addr').value.trim() : '';
        const note = document.getElementById('edit-note') ? document.getElementById('edit-note').value.trim() : '';
        const status = document.getElementById('edit-status') ? document.getElementById('edit-status').checked : true;
        return `${name}|${addr}|${note}|${status}`;
    }

    function openEditModal(id) {
        if (window.MWKValidation) window.MWKValidation.clearFormErrors(document.getElementById('edit-form'));

        if (typeof window.getFacilityById === 'function') {
            const item = window.getFacilityById(id);
            if (item) {
                document.getElementById('edit-id').value = item.id;
                document.getElementById('edit-name').value = item.name;
                document.getElementById('edit-addr').value = item.addr || '';
                document.getElementById('edit-note').value = item.note || '';
                
                const statusCb = document.getElementById('edit-status');
                statusCb.checked = item.status;
                const label = document.getElementById('edit-status-label');
                if (item.status) {
                    label.innerText = 'ON';
                    label.className = 'ml-2 text-xs font-bold text-[#2E7D32]';
                } else {
                    label.innerText = 'OFF';
                    label.className = 'ml-2 text-xs font-bold text-[#D32F2F]';
                }

                document.getElementById('edit-modal').classList.remove('hidden');
                initialEditSnapshot = getEditSnapshot();
            }
        }
    }

    function closeEditModal() {
        if (getEditSnapshot() !== initialEditSnapshot) {
            document.getElementById('edit-exit-modal').classList.remove('hidden');
        } else {
            document.getElementById('edit-modal').classList.add('hidden');
        }
    }

    function cancelEditExit() { document.getElementById('edit-exit-modal').classList.add('hidden'); }
    function confirmEditExit() {
        document.getElementById('edit-exit-modal').classList.add('hidden');
        document.getElementById('edit-modal').classList.add('hidden');
    }

    function handleSaveEdit(e) {
        e.preventDefault();
        const nameElem = document.getElementById('edit-name');

        if (window.MWKValidation) window.MWKValidation.clearFormErrors(document.getElementById('edit-form'));

        let isValid = true;

        if (!window.MWKValidation.validateRequired(nameElem, 'Trường dữ liệu không được để trống.')) {
            isValid = false;
        }

        if (!isValid) return;

        const id = Number(document.getElementById('edit-id').value);
        const name = nameElem.value.trim();
        const addr = document.getElementById('edit-addr').value.trim();
        const note = document.getElementById('edit-note').value.trim();
        const status = document.getElementById('edit-status').checked;

        if (typeof window.updateFacilityItem === 'function') {
            window.updateFacilityItem(id, { name, addr, note, status });
        }
        document.getElementById('edit-modal').classList.add('hidden');
        if (typeof window.showToast === 'function') window.showToast("Cập nhật thành công.", "success");
    }

    document.getElementById('edit-status').addEventListener('change', function() {
        const label = document.getElementById('edit-status-label');
        if (this.checked) {
            label.innerText = 'ON';
            label.className = 'ml-2 text-xs font-bold text-[#2E7D32]';
        } else {
            label.innerText = 'OFF';
            label.className = 'ml-2 text-xs font-bold text-[#D32F2F]';
        }
    });
</script>
