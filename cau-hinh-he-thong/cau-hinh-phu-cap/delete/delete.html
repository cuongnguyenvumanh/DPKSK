<!-- MODAL XÁC NHẬN XÓA CẤU HÌNH PHỤ CẤP -->
<div id="delete-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center hidden select-none p-4">
    <div class="bg-white rounded-[4px] border border-[#D9DEE5] shadow-lg w-full max-w-md overflow-hidden p-5 text-center">
        <div class="w-10 h-10 bg-[#FDECEC] text-[#D32F2F] rounded-full flex items-center justify-center mx-auto mb-3 text-lg border border-[#F5B5B5]">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="text-sm font-bold text-[#1F2937] mb-2">Xóa mức phụ cấp</h2>
        <p class="text-xs text-[#4B5563] mb-5 leading-relaxed">
            Bạn đang thực hiện Xóa cấu hình phụ cấp <strong id="delete-allowance-name" class="text-[#1F2937] font-bold">""</strong>. Bạn có chắc chắn thực hiện hành động này?
        </p>
        <div class="flex items-center justify-center gap-2">
            <button type="button" onclick="closeDeleteModal()" class="btn-secondary text-xs w-28">Thoát</button>
            <button type="button" onclick="handleConfirmDelete()" class="btn-danger text-xs w-28">Xóa</button>
        </div>
    </div>
</div>

<script>
    let activeDeleteId = null;

    function openDeleteModal(id) {
        activeDeleteId = id;
        if (typeof window.getAllowanceById === 'function') {
            const item = window.getAllowanceById(id);
            if (item) {
                document.getElementById('delete-allowance-name').innerText = `"${item.type} - ${item.object || item.obj}"`;
                document.getElementById('delete-modal').classList.remove('hidden');
            }
        }
    }

    function closeDeleteModal() {
        document.getElementById('delete-modal').classList.add('hidden');
        activeDeleteId = null;
    }

    function handleConfirmDelete() {
        if (activeDeleteId && typeof window.deleteAllowanceById === 'function') {
            window.deleteAllowanceById(activeDeleteId);
            if (typeof window.showToast === 'function') window.showToast("Xóa thành công.", "success");
        }
        closeDeleteModal();
    }
</script>
