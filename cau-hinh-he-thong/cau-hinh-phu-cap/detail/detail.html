<!-- MODAL CHI TIẾT CẤU HÌNH PHỤ CẤP -->
<div id="detail-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center hidden p-4">
    <div class="bg-white rounded-[4px] shadow-lg border border-[#D9DEE5] w-full max-w-lg overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="px-5 h-[52px] bg-[#27496D] text-white flex items-center justify-between">
            <h3 class="font-semibold text-sm text-white flex items-center gap-2">
                <i class="fa-solid fa-circle-info text-xs"></i> Chi tiết Mức phụ cấp
            </h3>
            <button type="button" onclick="closeDetailModal()" class="w-8 h-8 rounded-[4px] hover:bg-white/10 text-white flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark text-sm"></i></button>
        </div>

        <!-- Body -->
        <div class="p-5 space-y-4 text-xs">
            <div class="grid grid-cols-2 gap-4 border-b border-[#E6EAF0] pb-3">
                <div>
                    <span class="text-[#6B7280] uppercase font-semibold">STT (ID)</span>
                    <div id="modal-stt" class="font-mono font-bold text-[#27496D] text-sm mt-0.5"></div>
                </div>
                <div>
                    <span class="text-[#6B7280] uppercase font-semibold">Loại phụ cấp</span>
                    <div id="modal-type" class="font-bold text-[#1F2937] text-sm mt-0.5"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 border-b border-[#E6EAF0] pb-3">
                <div>
                    <span class="text-[#6B7280] uppercase font-semibold">Đối tượng áp dụng</span>
                    <div id="modal-object" class="text-[#1F2937] font-semibold mt-0.5"></div>
                </div>
                <div>
                    <span class="text-[#6B7280] uppercase font-semibold">Hình thức / Đơn vị tính</span>
                    <div id="modal-unit" class="text-[#1F2937] font-semibold mt-0.5"></div>
                </div>
            </div>

            <div>
                <span class="text-[#6B7280] uppercase font-semibold">Giá trị phụ cấp</span>
                <div id="modal-val" class="font-mono font-bold text-[#2E7D32] text-base mt-0.5"></div>
            </div>

            <div>
                <span class="text-[#6B7280] uppercase font-semibold">Ghi chú / Quy định</span>
                <div id="modal-note" class="text-[#4B5563] bg-[#F4F5F7] p-3 rounded-[4px] border border-[#D9DEE5] mt-1 leading-relaxed"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="px-5 py-3 bg-[#F4F5F7] border-t border-[#D9DEE5] flex justify-end">
            <button type="button" onclick="closeDetailModal()" class="btn-secondary text-xs">Đóng</button>
        </div>
    </div>
</div>

<script>
    function openDetailModal(id) {
        if (typeof window.getAllowanceById === 'function') {
            const item = window.getAllowanceById(id);
            if (item) {
                document.getElementById('modal-stt').innerText = `#${item.id}`;
                document.getElementById('modal-type').innerText = item.type;
                document.getElementById('modal-object').innerText = item.object;
                document.getElementById('modal-unit').innerText = item.unit;
                document.getElementById('modal-val').innerText = item.value;
                document.getElementById('modal-note').innerText = item.note || 'Không có ghi chú nào.';
                document.getElementById('detail-modal').classList.remove('hidden');
            }
        }
    }
    function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }
</script>
